#   output_directory: "./recordings"  # Where to save recorded data
  
#   # Multi-session configuration
#   num_sessions: 1  # Number of recording sessions to perform (1 = single recording)
#   interval_seconds: 20  # Time between sessions (GPIO OFF period)
#   startup_wait_seconds: 5  # Wait time before first recording starts (camera warmup)
  
# # Camera Configuration
# camera:
#   resolution: "1080p"  # Options: 1080p, 4k, 720p
#   fps: 30  # Frames per second
#   enable_depth: false  # Set to true to also record depth data
#   color_order: "BGR"  # BGR or RGB
  
# # GPIO Configuration
# gpio:
#   ft232h_url: "ftdi://ftdi:232h/1"  # FT232H device URL
#   trigger_pin: 0  # GPIO pin number (D0-D7, outputs 3.3V)
#   signal_high_duration: 0.1  # How long to keep signal HIGH in seconds
#   signal_mode: "continuous"  # "pulse" or "continuous" (continuous keeps signal HIGH for entire recording)
#   use_adbus: true  # Use D pins (ADBUS) for 3.3V output instead of C pins (ACBUS)
  
# # Post-processing Configuration
# postprocessing:
#   extract_frames: true  # Extract individual frames
