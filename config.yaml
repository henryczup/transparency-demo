# Multi-Session Recording Configuration Example
# This config runs multiple recording sessions with intervals between them

recording:
  duration_seconds: 10  # Each recording lasts 10 seconds (GPIO ON)
  output_directory: "./recordings"
  
  # Multi-session settings
  num_sessions: 5  # Perform 5 recording sessions
  interval_seconds: 20  # Wait 20 seconds between sessions (GPIO OFF)
  startup_wait_seconds: 60  # Wait 5 seconds before first recording (camera warmup)

# Camera Configuration
camera:
  resolution: "1080p"  # Options: 1080p, 4k, 720p
  fps: 30  # Frames per second
  enable_depth: false
  color_order: "BGR"

# GPIO Configuration
gpio:
  ft232h_url: "ftdi://ftdi:232h/1"
  trigger_pin: 0  # D0 pin
  signal_high_duration: 0.1
  signal_mode: "continuous"  # GPIO HIGH during recording, LOW during intervals
  use_adbus: true  # Use D pins for 3.3V output

# Post-processing Configuration
postprocessing:
  extract_frames: true
  frame_format: "jpg"
  generate_metadata: true
  frame_extraction_step: 1
