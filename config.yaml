# Multi-Session Recording Configuration Example
# This config runs multiple recording sessions with intervals between them

recording:
  duration_seconds: 10  # Each recording lasts 10 seconds (GPIO ON)
  output_directory: "./recordings"
  
  # Multi-session settings
  num_sessions: 5  # Perform 5 recording sessions
  interval_seconds: 20  # Wait 20 seconds between sessions (GPIO OFF)
  startup_wait_seconds: 0  # Wait 5 seconds before first recording (camera warmup)

# Camera Configuration
camera:
  resolution: "1080p"  # Options: 1080p, 4k, 720p
  fps: 30  # Frames per second
  enable_depth: false
  color_order: "BGR"

# GPIO Configuration
gpio:
  ft232h_url: "ftdi://ftdi:232h/1"
  trigger_pin: 0  # D0 pin
  signal_high_duration: 0.1
  signal_mode: "continuous"  # GPIO HIGH during recording, LOW during intervals
  use_adbus: true  # Use D pins for 3.3V output

# Post-processing Configuration
postprocessing:
  extract_frames: true
  frame_format: "jpg"
  generate_metadata: true
  frame_extraction_step: 1

# Transparency Analysis Configuration
transparency_analysis:
  enabled: true  # Enable transparency analysis
  roi_selection_mode: "interactive"  # "interactive" or "config"
  
  # ROI coordinates (used when roi_selection_mode is "config")
  roi_coordinates:
    x: 500
    y: 400
    width: 200
    height: 200
  
  # Baseline calculation (frames before GPIO trigger)
  baseline_frames: 0  # Number of initial frames to average for baseline
  
  # Visualization options
  visualization:
    create_plots: true  # Generate transparency plots
    annotate_frames: true  # Create before/after comparison images
    plot_gpio_trigger_line: true  # Show GPIO trigger time on plots

# Run-Level Analysis Configuration
run_analysis:
  # Image averaging settings
  averaged_image:
    frame_offset_from_end: 0  # Which frame to use (0 = last frame, 1 = second-to-last, etc.)
    # Examples:
    #   0 = Use the very last frame from each session
    #   5 = Use the frame 5 frames before the end
    #   10 = Use the frame 10 frames before the end
