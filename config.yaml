# =============================================================================
# UNIFIED CONFIGURATION FILE
# =============================================================================
# This single config file supports both OAK-D and IR cameras
# Simply change the camera.type parameter to switch between them
# =============================================================================

recording:
  duration_seconds: 10  # Each recording lasts 60 seconds (GPIO ON)
  output_directory: "./recordings"
  
  # Multi-recording settings (batch mode)
  num_recordings: 3  # Number of recordings in this batch
  interval_seconds: 10 # Wait 180 seconds between recordings (GPIO OFF)
  startup_wait_seconds: 5 # Wait before first recording (camera warmup)

# =============================================================================
# CAMERA CONFIGURATION
# =============================================================================
# Switch between camera types by changing the "type" parameter below
# =============================================================================

camera:
  # -------------------------------------------------------------------------
  # CAMERA TYPE SELECTION
  # -------------------------------------------------------------------------
  type: "ir"  # Options: "oakd" or "ir"
  #   - "oakd" = OAK-D depth camera (high quality, USB 3.0)
  #   - "ir"   = IR camera via OpenCV (flexible, any USB camera)
  
  # -------------------------------------------------------------------------
  # COMMON SETTINGS (used by both camera types)
  # -------------------------------------------------------------------------
  resolution: "480p"  # Options: "1080p", "4k", "720p", "480p"
  fps: 30  # Frames per second
  
  # -------------------------------------------------------------------------
  # OAK-D SPECIFIC SETTINGS (only used when type: "oakd")
  # -------------------------------------------------------------------------
  # Manual exposure settings (disable auto-exposure for consistent brightness)
  manual_exposure: false  # Set to true to lock exposure
  exposure_time_us: 40000  # Exposure time in microseconds (20000 = 20ms)
  iso: 100  # ISO sensitivity (100-1600)
  
  # Manual white balance (disable auto-white balance for consistent colors)
  manual_white_balance: false  # Set to true to lock white balance
  white_balance_temp: 5000  # Color temperature in Kelvin (2000-10000)
  enable_depth: false
  color_order: "BGR"
  
  # -------------------------------------------------------------------------
  # IR CAMERA SPECIFIC SETTINGS (only used when type: "ir")
  # -------------------------------------------------------------------------
  camera_index: 0  # Specific camera index to use (try 0, 1, 2, etc.)
  probe_indices: [0, 1, 2, 3, 4]  # List of indices to try if camera_index fails
  # backend: null  # Optional: OpenCV backend (e.g., cv2.CAP_DSHOW for Windows)

# =============================================================================
# GPIO CONFIGURATION
# =============================================================================

gpio:
  ft232h_url: "ftdi://ftdi:232h/1"  # FT232H device URL
  trigger_pin: 0  # D0 pin
  signal_high_duration: 0.1
  signal_mode: "continuous"  # GPIO HIGH during recording, LOW during intervals
  use_adbus: true  # Use D pins for 3.3V output

# =============================================================================
# POST-PROCESSING CONFIGURATION
# =============================================================================
# Calculates difference frames (end - start) for each recording
# Then averages all difference frames across the batch
# =============================================================================

postprocessing:
  enabled: true  # Enable post-processing
  
  # Frame offsets to exclude startup/cooldown artifacts
  start_frame_offset: 30  # Skip first N frames (camera startup artifacts)
  end_frame_offset: 30    # Skip last N frames (camera cooldown artifacts)
  # Example: With 300 total frames, offsets of 30 each means:
  #   - Start frame: frame 30 (skip first 30)
  #   - End frame: frame 269 (skip last 30)
  #   - Frames analyzed: 240 frames of clean data

# =============================================================================
# QUICK START EXAMPLES
# =============================================================================
#
# Example 1: Use IR Camera with single recording
#   camera:
#     type: "ir"
#     camera_index: 0
#   recording:
#     num_recordings: 1
#
# Example 2: Use OAK-D Camera with batch of 5 recordings
#   camera:
#     type: "oakd"
#     resolution: "1080p"
#   recording:
#     num_recordings: 5
#     interval_seconds: 120
#
# Example 3: Quick test (30 second recording, no GPIO)
#   recording:
#     duration_seconds: 30
#     num_recordings: 1
#     startup_wait_seconds: 0
#
# =============================================================================
